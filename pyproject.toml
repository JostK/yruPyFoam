[build-system]

[project]
name = "yruPyFoam"
version = "0.0.1"
authors = [
  { name="Jost Kemper", email="jost.kemper@fh-kiel.de" },
  { name="Jan Mense", email="jmense@geomar.de" },
]
description = "Python toolbox for multiple usecases with OpenFOAM"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
"Homepage" = "https://github.com/NOTYETONGITHUB"
"Bug Tracker" = "https://github.com/NOTYETONGITHUB/issues"